name: eccs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eccs
      POSTGRES_PASSWORD: eccs
      POSTGRES_DB: eccs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Stands in for Amazon S3 locally (S3 API on http://localhost:8333, no credentials checked).
  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
