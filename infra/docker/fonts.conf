<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The API image's font choices (Stage H, 19 Oct 2026), copied to /etc/fonts/local.conf.
  When a report holds text in a script "Noto Sans" itself lacks, Chromium asks fontconfig for
  another font. Left alone, it picked Noto Serif Kannada, Noto Serif Gujarati and Noto Kufi
  Arabic (a display style) beside the plain Noto Sans of everything else. These lists keep each
  Indian script in the same plain Noto Sans style, and Urdu in Nastaliq, the style Urdu is read in.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Kannada</family>
      <family>Noto Sans Malayalam</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Gujarati</family>
      <family>Noto Sans Gurmukhi</family>
      <family>Noto Sans Oriya</family>
      <family>Noto Nastaliq Urdu</family>
      <family>Noto Naskh Arabic</family>
    </prefer>
  </alias>
</fontconfig>
