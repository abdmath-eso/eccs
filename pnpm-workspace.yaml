packages:
  - apps/*
  - packages/*

# Expo / React Native resolve native modules most reliably with a flat node_modules.
nodeLinker: hoisted

allowBuilds:
  sharp: false
  # Its install script only fetches graphics-card add-ons on Linux; the face models run on the processor.
  onnxruntime-node: false
  unrs-resolver: false
  esbuild: true
  # Its install script only prints a funding message.
  tesseract.js: false
  prisma: true
  '@prisma/engines': true
